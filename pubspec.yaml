name: vin_alarm_system
description: "Vin's Alarm - A quick alarm app for BRB, lunch breaks, and urgent reminders."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^17.2.4
  permission_handler: ^11.0.0
  shared_preferences: ^2.2.2
  timezone: ^0.9.4
  audioplayers: ^6.0.0
  vibration: ^3.2.0
  torch_light: ^1.0.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  wakelock_plus: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
